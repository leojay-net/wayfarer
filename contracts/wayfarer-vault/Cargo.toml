[package]
name = "wayfarer-vault"
version = "0.1.0"
edition = "2021"
description = "Spending-policy vault for AI agents on NEAR (testnet prototype, unaudited)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
near-primitives = "0.38"
near-crypto = "0.38"
borsh = "1"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
